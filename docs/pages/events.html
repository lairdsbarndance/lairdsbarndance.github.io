<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <script src="/scripts/functions.js"></script>
    <script src="/script.js" defer></script>
    <script src="/scripts/events.js" defer></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/styles/leather.css">
    <link rel="stylesheet" href="/styles/events.css">
    <title>Events</title>
    <meta name="description" content="Browse photographs and highlights from The Lairds' past barn dances, ceilidhs and other performances, celebrating the events and occasions we've played for.">
</head>
<body class="radial-gradient">
    <header class="leather rough-border pre-render">
        <h3><a href="/index.html">lairdsbarndance.band</a></h3>
        <div class="spacer"></div>
        <nav>
            <ul>
                <a href="/">Home</a>
                <a href="/pages/meet_the_band">Meet the Band</a>
                <a href="/pages/history">History</a>
                <a href="/pages/packages">Packages</a>
                <a href="/pages/test">Test</a>
                <a href="/pages/faqs">FAQs</a>
                <a href="/pages/events">Events</a>
                <a href="/pages/contact">Contact</a>
            </ul>
        </nav>
    </header>
    <div class="banner"><h1>Events</h1></div>
    <div class="scroll-wrapper" data-prevent-default-scroll-navigation>
        <main class="banner-padding">
            <section class="events bg-glow" data-glow-pos="center" data-glow-size="100%" data-min-package-aspect-ratio="1.25" data-glow-mask-content="false">
            </section>
            <svg
                id="timeline-svg"
                class="timeline"
                xmlns="http://www.w3.org/2000/svg"
            >
                <defs>
                    <filter id="circle-blur">
                        <feGaussianBlur stdDeviation="16" />
                    </filter>

                    <mask
                        id="timeline-mask"
                        maskUnits="userSpaceOnUse"
                        x="0"
                        y="0"
                        width="100%"
                        height="100%"
                        style="mask-type: luminance"
                    >
                        <rect width="100%" height="100%" fill="white"/>

                        <g filter="url(#circle-blur)" fill="black">
                            <circle id="mask-top" cx="0" cy="0" r="128"/>
                            <circle id="mask-bottom" cx="0" cy="0" r="128"/>
                        </g>
                    </mask>
                </defs>

                <path
                    id="timeline-curve"
                    d="M 200 40 C 200 100, 200 200, 200 260"
                    fill="none"
                    stroke="currentColor"
                    mask="url(#timeline-mask)"
                />
            </svg>
        </main>
    </div>
</body>
</html>
